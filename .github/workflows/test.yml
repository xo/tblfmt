on: [push, pull_request]
name: Test
jobs:
  test:
    name: Test (${{ matrix.os }})
    # the encoders write the newline of the platform, so the tests run on each
    # of them (D62)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # the checkout comes before setup-go, so that setup-go finds the go.sum
    # files to cache the modules by
    steps:
    - name: Configure Git
      run: |
        git config --global core.autocrlf input
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        cache-dependency-path: |
          go.sum
          test/go.sum
    - name: Test
      run: |
        go test -v ./...
    # the comparison module of D59 has its own go.mod
    - name: Test the comparison module
      if: matrix.os == 'ubuntu-latest'
      working-directory: test
      run: go test -v ./...
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        cache-dependency-path: |
          go.sum
          test/go.sum
    # pinned, because .golangci.yml sets `default: all` and a newer release
    # can enable a linter nobody chose. see D49 in docs/PLAN.md
    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
    - name: Lint
      run: golangci-lint run ./...
    - name: Lint the comparison module
      working-directory: test
      run: golangci-lint run ./...
    - name: Check formatting
      run: |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "these files are not formatted:"
          echo "$out"
          exit 1
        fi
  psql:
    name: Compare with psql
    runs-on: ubuntu-latest
    env:
      # the dbmeta commit whose dbrun starts the server, as in dbimp
      DBMETA_COMMIT: a58e5c09440898065ff4d2d099378cc85cf93ec1
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Checkout dbmeta
      uses: actions/checkout@v7
      with:
        repository: xo/dbmeta
        ref: ${{ env.DBMETA_COMMIT }}
        path: dbmeta
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        cache-dependency-path: |
          test/go.sum
          dbmeta/test/go.sum
    # TestPsql compares with psql 18, which the runner does not have
    - name: Install psql 18
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-client-18
        echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
    - name: Start postgres-18
      working-directory: dbmeta/test
      run: go run ./cmd/dbrun start postgres-18
    - name: Compare with psql
      run: |
        DBMETA_POSTGRES=$(cd dbmeta/test && go run ./cmd/dbrun dsn --json postgres-18 | jq -r '.[0].url')
        export DBMETA_POSTGRES
        cd test && go test -count=1 -run TestPsql -v ./...
    - name: Remove postgres-18
      if: always()
      working-directory: dbmeta/test
      run: go run ./cmd/dbrun remove postgres-18
